# An object held and turned in the hand, rather than a fixed camera watching a
# joint. In-plane rotation degrades the point tracker, and the tracks that go
# bad form a coherent group that looks like a part, so a split has to clear a
# joint-sized displacement and the outlier band widens with the turn.
extends: sparse.yaml

split_min_rot_deg: 30.0
split_min_trans_m: 0.03
rot_tol: 3.0
motion_sigma: 1.0
key_angle_deg: 10.0
n_points: 200
split_out_pts: 4
# A single frame must not be allowed to decide a split here.  When a hand
# carries the whole object, one frame's residual is large everywhere, and the
# cut it makes runs through the object rather than between its parts: measured
# on lift01, the frame-90 fallback split produced two point sets both spread
# over the whole toy, whose relative pose was noise -- 37 deg of spurious
# rotation that typed the sliding rings revolute.  Waiting for the
# co-association evidence splits the same recording into rings vs base and
# types it prismatic.
frame_fallback: false

# The mask here comes from SAM 2 and really does leak at the silhouette, so the
# depth filter is switched from the generous fixed 0.15 m to the local rule:
# tolerance from the window's own footprint at that depth times the steepest
# slope worth keeping. Not the default, because RBO's masks are rendered from
# ground truth and have no leak, so there the filter can only do damage.
mask_jump: 0.0
