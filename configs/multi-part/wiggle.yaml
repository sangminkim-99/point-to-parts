# The acquisition demo: find the joint from as little motion as possible. Every
# threshold is lowered, which finds smaller joints and more false ones.
extends: sparse.yaml

split_min_rot_deg: 4.0
split_min_trans_m: 0.008
split_sep_sigma: 3.0
split_out_frac: 0.08
co_min_seen: 1.5
min_frames_before_split: 6
joint_min_obs: 8
